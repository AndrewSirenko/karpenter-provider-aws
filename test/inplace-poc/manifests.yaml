apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: inplace
spec:
  role: KarpenterNodeRole-inplace-poc
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: inplace-poc
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: inplace-poc
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: inplace
spec:
  template:
    metadata:
      labels:
        poc: inplace
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: inplace
      taints:
        - key: poc
          value: inplace
          effect: NoSchedule
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inplace-workload
spec:
  replicas: 1
  selector:
    matchLabels: {app: inplace-workload}
  template:
    metadata:
      labels: {app: inplace-workload}
    spec:
      nodeSelector: {poc: inplace}
      tolerations:
        - {key: poc, value: inplace, effect: NoSchedule}
      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.9
          resources:
            requests: {cpu: "1"}
