name: SnapshotPR
on:
  workflow_run:
    workflows:
      - ApprovalComment
    types:
      - completed
jobs:
  resolve:
    permissions:
      contents: read
      pull-requests: write # write is required so the gate step can post the sensitive-files comment
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      PR_COMMIT: ${{ steps.verify.outputs.PR_COMMIT }}
      PR_NUMBER: ${{ steps.metadata.outputs.PR_NUMBER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/download-artifact
      - id: metadata
        run: |
          # The review body is line 1; keeping only its first line guards against
          # multi-line bodies injecting extra step outputs via embedded newlines.
          command="$(head -n 1 /tmp/artifacts/metadata.txt)"
          pr_number="$(head -n 2 /tmp/artifacts/metadata.txt | tail -n 1)"
          pr_commit="$(tail -n 1 /tmp/artifacts/metadata.txt)"
          echo "COMMAND=${command}" >> "$GITHUB_OUTPUT"
          echo "PR_COMMIT=${pr_commit}" >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=${pr_number}" >> "$GITHUB_OUTPUT"
      - id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.PR_NUMBER }}
          PR_COMMIT: ${{ steps.metadata.outputs.PR_COMMIT }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const prCommit = process.env.PR_COMMIT;

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber }
            );

            const validReview = reviews.find(r =>
              r.author_association === 'MEMBER' &&
              r.commit_id === prCommit
            );

            if (!validReview) {
              core.setFailed(
                `No MEMBER review found for commit ${prCommit} on PR #${prNumber}. ` +
                `The snapshot commit must match a commit reviewed by a repository member.`
              );
              return;
            }

            core.info(`Verified: ${validReview.user.login} reviewed commit ${prCommit}`);
            core.setOutput('PR_COMMIT', prCommit);
      # Block snapshots of PRs that touch files which execute on the snapshot runner
      # while it holds the OIDC credentials (Makefile, hack scripts, composite actions,
      # workflows, build config). A malicious contributor could otherwise slip a
      # credential-leaking change into one of these and have a maintainer's /karpenter
      # snapshot run it. A maintainer who has vetted the change can re-run with
      # `/karpenter snapshot-override` (still member-gated by ApprovalComment).
      # This runs in the resolve job, which executes from the base branch (main) and
      # never checks out PR code, so the check itself cannot be tampered with.
      - id: gate
        if: ${{ !endsWith(steps.metadata.outputs.COMMAND, 'snapshot-override') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.metadata.outputs.PR_NUMBER }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);

            // Broad denylist of paths that influence what runs on the snapshot
            // runner. Matched against the PR's changed files (relative to base).
            const isSensitive = (f) =>
              f.startsWith('.github/') ||
              f.startsWith('hack/') ||
              f === 'Makefile' ||
              f === 'go.mod' ||
              f === 'go.sum' ||
              f.endsWith('.sh');

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber }
            );

            const sensitive = files.map(f => f.filename).filter(isSensitive);

            if (sensitive.length > 0) {
              const list = sensitive.map(f => `\`${f}\``).join(', ');
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `Note: this PR changes sensitive files that execute during the snapshot build (${list}). ` +
                  `Snapshot was **not** run. A maintainer who has reviewed these changes can re-run with \`/karpenter snapshot-override\` if this is fine.`
              });
              core.setFailed(`Snapshot blocked: PR changes sensitive files: ${sensitive.join(', ')}`);
              return;
            }

            core.info('No sensitive files changed; proceeding with snapshot.');

  snapshot:
    needs: [resolve]
    permissions:
      id-token: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.PR_COMMIT }}
      - uses: ./.github/actions/commit-status/start
        with:
          name: "${{ github.workflow }} / ${{ github.job }} (pull_request_review)"
          git_ref: ${{ needs.resolve.outputs.PR_COMMIT }}
      - uses: ./.github/actions/install-deps
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: 'arn:aws:iam::${{ vars.SNAPSHOT_ACCOUNT_ID }}:role/${{ vars.SNAPSHOT_ROLE_NAME }}'
          aws-region: ${{ vars.SNAPSHOT_REGION }}
      - run: make snapshot
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.PR_NUMBER }}
          PR_COMMIT: ${{ needs.resolve.outputs.PR_COMMIT }}
          SNAPSHOT_ACCOUNT_ID: ${{ vars.SNAPSHOT_ACCOUNT_ID }}
          SNAPSHOT_REGION: ${{ vars.SNAPSHOT_REGION }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: parseInt(process.env.PR_NUMBER, 10),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Snapshot successfully published to \`oci://${process.env.SNAPSHOT_ACCOUNT_ID}.dkr.ecr.${process.env.SNAPSHOT_REGION}.amazonaws.com/karpenter/snapshot/karpenter:0-${process.env.PR_COMMIT}\`.
            To install you must login to the ECR repo with an AWS account:
            ~~~
            aws ecr get-login-password --region ${process.env.SNAPSHOT_REGION} | docker login --username AWS --password-stdin ${process.env.SNAPSHOT_ACCOUNT_ID}.dkr.ecr.${process.env.SNAPSHOT_REGION}.amazonaws.com

            helm upgrade --install karpenter oci://${process.env.SNAPSHOT_ACCOUNT_ID}.dkr.ecr.${process.env.SNAPSHOT_REGION}.amazonaws.com/karpenter/snapshot/karpenter --version "0-${process.env.PR_COMMIT}" --namespace "kube-system" --create-namespace \\
              --set "settings.clusterName=\${CLUSTER_NAME}" \\
              --set "settings.interruptionQueue=\${CLUSTER_NAME}" \\
              --set controller.resources.requests.cpu=1 \\
              --set controller.resources.requests.memory=1Gi \\
              --set controller.resources.limits.cpu=1 \\
              --set controller.resources.limits.memory=1Gi \\
              --wait
            ~~~
            `
            })
      - if: always()
        uses: ./.github/actions/commit-status/end
        with:
          name: "${{ github.workflow }} / ${{ github.job }} (pull_request_review)"
          git_ref: ${{ needs.resolve.outputs.PR_COMMIT }}
