name: E2EMatrix
on:
  workflow_call:
    inputs:
      region:
        type: string
        default: "us-east-2"
      k8s_version:
        type: string
        default: "1.30"
      cleanup:
        type: boolean
        required: true
      git_ref:
        type: string
      workflow_trigger:
        type: string
        required: true
      parallelism:
        type: number
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
  workflow_dispatch:
    inputs:
      region:
        type: choice
        options:
          - "us-east-1"
          - "us-east-2"
          - "us-west-2"
          - "eu-west-1"
        default: "us-east-2"
      k8s_version:
        type: choice
        options:
          - "1.23"
          - "1.24"
          - "1.25"
          - "1.26"
          - "1.27"
          - "1.28"
          - "1.29"
          - "1.30"
        default: "1.30"
      cleanup:
        type: boolean
        required: true
        default: true
# All jobs will run under the following conditions:
#   1. Upstream Karpenter repo triggered the job by schedule, push, or dispatch
#   2. Upstream Karpenter repo triggered the job by workflow_run, which requires maintainer check to succeed
#   3. Downstream fork triggered the job through dispatch and has set 'ENABLE_E2E' in repo environment variables
jobs:
  e2e:
    permissions:
      id-token: write # aws-actions/configure-aws-credentials@v4.0.1
      statuses: write # ./.github/actions/commit-status/start
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallelism || 100 }}
      matrix:
        suite:
          - name: Integration
            region: ${{ inputs.region }}
          - name: NodeClaim
            region: ${{ inputs.region }}
          - name: Consolidation
            region: ${{ inputs.region }}
          - name: Interruption
            region: ${{ inputs.region }}
          - name: Drift
            region: ${{ inputs.region }}
          - name: Expiration
            region: ${{ inputs.region }}
          - name: Chaos
            region: ${{ inputs.region }}
          - name: IPv6
            region: ${{ inputs.region }}
          - name: LocalZone
            # LAX is the only local zone available in the CI account, therefore only use us-west-2
            region: us-west-2
    uses: ./.github/workflows/e2e.yaml
    with:
      suite: ${{ matrix.suite.name }}
      git_ref: ${{ inputs.git_ref }}
      region: ${{ matrix.suite.region }}
      k8s_version: ${{ inputs.k8s_version }}
      cleanup: ${{ inputs.cleanup }}
      workflow_trigger: ${{ inputs.workflow_trigger }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  summary:
    # Collapse the per-suite Slack pings into one message per run: highlight failures, note the rest passed.
    needs: [e2e, e2e-upgrade]
    if: always() && inputs.workflow_trigger == 'matrix'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          pattern: e2e-status-*
          path: suite-status
          merge-multiple: true
      - id: compose
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            ctx="periodic run"
          else
            ctx="run for ${GITHUB_SHA::7}"
          fi

          # Map each failed suite to its own job URL (all suites share one run, so link the per-suite job)
          jobs_tsv="$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate -q '.jobs[] | [.name, .html_url] | @tsv')"
          job_url() {
            local url
            url="$(awk -F'\t' -v s="$1" 'index(tolower($1), tolower(s)) {print $2; exit}' <<< "$jobs_tsv")"
            printf '%s' "${url:-$run_url}"
          }
          join_by() { local d="$1"; shift; local out="${1:-}"; shift || true; local x; for x in "$@"; do out+="$d$x"; done; printf '%s' "$out"; }

          failed=(); passed=()
          for f in suite-status/*; do
            name="$(basename "$f")"
            if [[ "$(cat "$f")" == "success" ]]; then passed+=("$name"); else failed+=("$name"); fi
          done
          total=$(( ${#passed[@]} + ${#failed[@]} ))

          # Bare URLs auto-link everywhere (Slack mrkdwn <url|text> does not render in Workflow Builder)
          if [[ ${#failed[@]} -eq 0 ]]; then
            msg=":white_check_mark: E2E ${ctx} — all ${total} suites passed: ${run_url}"
          else
            msg=":x: E2E ${ctx} — ${#failed[@]}/${total} suites failed: ${run_url}"
            for s in "${failed[@]}"; do
              msg+=$'\n'":x: ${s}: $(job_url "$s")"
            done
            msg+=$'\n'":white_check_mark: ${#passed[@]} passed: $(join_by ", " "${passed[@]:-}")"
          fi

          # message: real newlines (valid via jq); message_escaped: \n literals for send-message's hand-built JSON
          {
            echo "message<<__MSG__"
            printf '%s\n' "$msg"
            echo "__MSG__"
          } >> "$GITHUB_OUTPUT"
          echo "message_escaped=${msg//$'\n'/\\n}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/e2e/slack/send-message
        with:
          url: ${{ secrets.SLACK_WEBHOOK_URL }}
          message: ${{ steps.compose.outputs.message_escaped }}
  e2e-upgrade:
    permissions:
      id-token: write # aws-actions/configure-aws-credentials@v4.0.1
      statuses: write # ./.github/actions/commit-status/start
    uses: ./.github/workflows/e2e-upgrade.yaml
    with:
      from_git_ref: b3076dca62a81caae2d3c4af4fd378c83a901c48
      to_git_ref: ${{ inputs.git_ref }}
      region: ${{ inputs.region }}
      k8s_version: ${{ inputs.k8s_version }}
      cleanup: ${{ inputs.cleanup }}
      workflow_trigger: ${{ inputs.workflow_trigger }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
